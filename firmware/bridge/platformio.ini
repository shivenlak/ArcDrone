; ESP32 serial <-> ESP-NOW bridge. Same binary on both boards.
; Flash:   pio run -t upload
; Monitor: pio device monitor   (type hex, press Enter)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
