; ESP32 serial <-> ESP-NOW bridge. Same binary on both boards.
; Flash:   pio run -t upload
; Monitor: pio device monitor   (type hex, press Enter)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
; Generic dev board: BOOT button on GPIO0, blue LED on GPIO2.
build_flags = -DMUTE_BUTTON_PIN=0 -DACTIVITY_LED_PIN=2

; Adafruit ESP32 Feather V2 (incl. w.FL): user button SW38 on GPIO38, red LED on GPIO13.
; (GPIO0/GPIO2 on this board are the NeoPixel, so the esp32dev pins would be wrong.)
; Flash:   pio run -e feather_v2 -t upload
[env:feather_v2]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
build_flags = -DMUTE_BUTTON_PIN=38 -DACTIVITY_LED_PIN=13

; Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262, OLED): PRG button on GPIO0, white LED on GPIO35.
; Has its own 2.4 GHz antenna for ESP-NOW. Never transmit LoRa without the LoRa antenna attached.
; Flash:   pio run -e heltec_v3 -t upload
[env:heltec_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
build_flags = -DMUTE_BUTTON_PIN=0 -DACTIVITY_LED_PIN=35

; Heltec WiFi LoRa 32 V4: same PRG/LED pins as V3 (check against the board's pinout when it arrives).
[env:heltec_v4]
extends = env:heltec_v3
board = heltec_wifi_lora_32_V4
